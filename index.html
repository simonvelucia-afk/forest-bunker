<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modulimo – Bunker interactif</title>

<style>
body {
    margin:0;
    background:#0a0f14;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

#container {
    position:relative;
    width:100vw;
    height:100vh;
}

img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay {
    position:absolute;
    border:2px solid rgba(0,255,150,0.4);
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
}

.overlay:hover {
    border-color:#00ffcc;
    box-shadow:0 0 15px #00ffcc;
}

.tooltip {
    position:absolute;
    background:rgba(0,0,0,0.8);
    padding:8px 12px;
    border-radius:6px;
    font-size:13px;
    pointer-events:none;
    opacity:0;
    transition:0.2s;
}

.toggle {
    position:absolute;
    top:20px;
    left:20px;
    display:flex;
    gap:10px;
}

.btn {
    padding:8px 14px;
    background:#111;
    border:1px solid #444;
    cursor:pointer;
    font-size:12px;
}

.btn.active {
    background:#00ffaa;
    color:black;
}

.line {
    position:absolute;
    height:3px;
    opacity:0.7;
}

.water { background:#00aaff; }
.energy { background:#ff6a00; }
.food { background:#00ff66; }

</style>
</head>

<body>

<div id="container">

<!-- IMAGE -->
<img src="TON_IMAGE.png">

<!-- ZONES INTERACTIVES -->
<div class="overlay" style="top:35%; left:25%; width:18%; height:12%;" data-text="Zone de vie"></div>
<div class="overlay" style="top:35%; left:55%; width:18%; height:12%;" data-text="Production + énergie"></div>
<div class="overlay" style="top:60%; left:40%; width:20%; height:18%;" data-text="Agriculture intérieure"></div>
<div class="overlay" style="top:48%; left:47%; width:6%; height:25%;" data-text="Tuyau central"></div>

<!-- LIGNES -->
<div class="line water" style="top:45%; left:30%; width:20%;"></div>
<div class="line energy" style="top:45%; left:50%; width:20%;"></div>
<div class="line food" style="top:65%; left:45%; width:15%;"></div>

<!-- TOOLTIP -->
<div id="tooltip" class="tooltip"></div>

<!-- TOGGLES -->
<div class="toggle">
    <div class="btn active" onclick="toggle('water',this)">Eau</div>
    <div class="btn active" onclick="toggle('energy',this)">Énergie</div>
    <div class="btn active" onclick="toggle('food',this)">Nourriture</div>
</div>

</div>

<script>
const tooltip = document.getElementById("tooltip");

document.querySelectorAll(".overlay").forEach(el=>{
    el.addEventListener("mousemove", e=>{
        tooltip.style.opacity=1;
        tooltip.innerText=el.dataset.text;
        tooltip.style.left=e.pageX+10+"px";
        tooltip.style.top=e.pageY+10+"px";
    });
    el.addEventListener("mouseleave", ()=>{
        tooltip.style.opacity=0;
    });
});

function toggle(type,btn){
    document.querySelectorAll("." + type).forEach(el=>{
        el.style.display = el.style.display === "none" ? "block" : "none";
    });
    btn.classList.toggle("active");
}
</script>

</body>
</html>
